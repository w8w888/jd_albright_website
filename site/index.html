<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JD Albright</title>
  <meta name="description" content="JD Albright: Computer Science student at the University of Michigan. Portfolio, with an optional recreation of the Xbox 360 dashboard.">
  <meta name="theme-color" content="#d3d3d3">
  <link rel="preload" href="fonts/convection.ttf" as="font" type="font/ttf" crossorigin>
  <script>
    // Pick the view (?view=modern|classic, else the last choice) and its stylesheet before first paint.
    (function () {
      var v = new URLSearchParams(location.search).get('view');
      try { if (v) localStorage.setItem('view', v); else v = localStorage.getItem('view'); } catch (e) {}
      v = v === 'modern' ? 'modern' : 'classic';
      document.documentElement.dataset.view = v;
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = v === 'modern' ? 'css/modern.css' : 'css/dashboard.css';
      document.head.appendChild(l);
    })();
  </script>
  <script type="module" src="js/boot.js"></script>
</head>
<body>
  <main id="viewport">
    <div id="stage" role="application" aria-label="JD Albright portfolio">
      <div id="backdrop" aria-hidden="true"></div>
    </div>
    <button id="mute" type="button" aria-label="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
        <path class="mute-waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path class="mute-cross" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </main>
</body>
</html>
